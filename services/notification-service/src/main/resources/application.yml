server:
  port: 8082

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5434}/${NOTIFICATION_DB_NAME:notification_db}
    username: ${NOTIFICATION_DB_USER:notification_service}
    password: ${NOTIFICATION_DB_PASSWORD}

    hikari:
      pool-name: NotificationServiceHikariPool
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    listener:
      simple:
        default-requeue-rejected: false

        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
          max-attempts: 3

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM:no-reply@practica.local}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true
