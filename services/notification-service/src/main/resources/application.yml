server:
  port: ${NOTIFICATION_SERVICE_PORT:8082}

spring:

  application:
    name: notification-service


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info
          - prometheus

  endpoint:

    health:

      show-details: always

      probes:

        enabled: true


info:

  app:

    name: notification-service

    version: 1.0.0-SNAPSHOT

    description: Notification processing service
