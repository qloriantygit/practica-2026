server:
  port: ${API_GATEWAY_PORT:8080}

spring:

  application:
    name: api-gateway

  cloud:

    gateway:

      server:

        webflux:

          routes:

            - id: notification-service

              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}

              predicates:

                - Path=/api/v1/notifications/**


            - id: admin-service

              uri: ${ADMIN_SERVICE_URL:http://localhost:8081}

              predicates:

                - Path=/api/v1/**


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info
          - prometheus

  endpoint:

    health:

      show-details: always

      probes:

        enabled: true


info:

  app:

    name: api-gateway

    version: 1.0.0-SNAPSHOT

    description: API Gateway for practica-2026
