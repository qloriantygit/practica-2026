server:
  port: ${ADMIN_SERVICE_PORT:8081}

spring:

  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://${ADMIN_DB_HOST:localhost}:${ADMIN_DB_PORT:5433}/${ADMIN_DB_NAME:admin_db}
    username: ${ADMIN_DB_USER:admin_service}
    password: ${ADMIN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: AdminServiceHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/practica-2026}

management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:

  app:
    name: admin-service
    version: 1.0.0-SNAPSHOT
    description: Administration, NSI, users and permissions service
app:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER}
      secret-key: ${MINIO_ROOT_PASSWORD}
      bucket: ${MINIO_DIRECTORY_BUCKET:practica-directory-files}
